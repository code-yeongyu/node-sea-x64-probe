name: sea-x64-intel
on: [push]
permissions:
  contents: read
jobs:
  intel:
    runs-on: macos-26-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Host
        run: |
          echo "CPU $(sysctl -n machdep.cpu.brand_string)"; echo "uname $(uname -m)"; echo "translated $(sysctl -n sysctl.proc_translated 2>/dev/null || echo n/a)"; sw_vers
      - name: Hello SEA with Node 26.8.2 and 26.12.1 (darwin-x64, checksum verified)
        run: |
          set +e
          for v in 26.8.2 26.12.1; do
            curl -fsSL -o node-$v.tar.xz https://nodejs.org/dist/v$v/node-v$v-darwin-x64.tar.xz
            curl -fsSL -o S$v.txt https://nodejs.org/dist/v$v/SHASUMS256.txt
            grep " node-v$v-darwin-x64.tar.xz$" S$v.txt | sed "s/node-v$v-darwin-x64.tar.xz/node-$v.tar.xz/" | shasum -a 256 -c - || exit 1
            mkdir n$v && tar -xJf node-$v.tar.xz -C n$v --strip-components 1
            ./n$v/bin/node -e 'process.exit(0)'; echo "CONTROL $v plain node exit=$?"
            printf '%s' '{"main":"hello.js","output":"hello'$v'","disableExperimentalSEAWarning":true,"useCodeCache":false,"useSnapshot":false}' > sea$v.json
            ./n$v/bin/node --build-sea sea$v.json; echo "BUILD $v exit=$?"
            codesign --sign - --force hello$v
            ./hello$v; st=$?; sig=""; [ $st -gt 128 ] && sig="signal=$((st-128))"; echo "SEA_RUN $v exit=$st $sig"
          done
